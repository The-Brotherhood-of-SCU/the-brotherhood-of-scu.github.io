name: Sync members

on:
  schedule:
    # 每天 UTC 02:30（北京时间 10:30）
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 推送后显式派发 deploy.yml 需要
  actions: write

concurrency:
  group: sync-members
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync members
        env:
          # 内置 GITHUB_TOKEN 无权读取组织成员（read:org），需用有 read:org 的 PAT secret
          GH_TOKEN: ${{ secrets.MEMBERS_SYNC_TOKEN }}
        run: node scripts/sync-members.mjs

      - name: Commit and dispatch deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/members.json; then
            echo "成员名单无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/members.json
          git commit -m "chore: 自动同步组织成员名单"
          git push
          # GITHUB_TOKEN 的 push 按设计不触发工作流，这里显式派发一次
          gh workflow run deploy.yml --ref main
